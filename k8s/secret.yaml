apiVersion: v1
kind: Secret
metadata:
  name: vault-secrets
  namespace: devops-vault
type: Opaque
stringData:
  # In production, inject this from Azure Key Vault or Jenkins withCredentials
  AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=devopsvaultstore01;AccountKey=REPLACE_WITH_YOUR_AZURE_STORAGE_KEY;EndpointSuffix=core.windows.net"
